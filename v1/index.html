<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rambabu Logo v1</title>
<meta name="description" content="Rambabu full logo (v1). AI-generated with Google Gemini, directed and selected by Rambabu.">
<meta name="theme-color" content="#111217">
<link rel="icon" type="image/png" href="../main/rambabu-monogram-512x512.png">
<style>
  :root {
    --bg: #111217;
    --ink: #e6ebf5;
    --ink-dim: #8a93a8;
    --indigo: #646ee0;
    --cyan: #3ed9f3;
    --mint: #35d8a9;
    --brand: linear-gradient(90deg, var(--indigo), var(--cyan) 50%, var(--mint));
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: grid;
    grid-template-rows: 1fr auto;
  }
  .stage {
    display: grid; place-items: center; padding: 32px 16px;
  }
  figure { width: 100%; max-width: 1200px; display: grid; gap: 16px; }
  figure img {
    width: 100%; height: auto; display: block;
    border-radius: 18px;
    box-shadow: 0 0 0 1px rgba(62, 217, 243, .14), 0 40px 120px rgba(0, 0, 0, .6);
  }
  figcaption {
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    font: 13px ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink-dim);
  }
  .bar { height: 3px; background: var(--brand); border-radius: 3px; }
  footer { padding: 20px 16px 32px; text-align: center; color: var(--ink-dim); font-size: 13px; line-height: 1.6; }
  footer strong { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
  <div class="stage">
    <figure>
      <img src="rambabu-logo-full-2400x1792.png" width="2400" height="1792"
           alt="Rambabu v1 logo: neon-circuit monogram of the letters R, A, M, B, U on a dark circuit-grid background">
      <div class="bar" aria-hidden="true"></div>
      <figcaption>
        <span>v1 · full logo · 2400 × 1792 PNG</span>
        <span>#646ee0 · #3ed9f3 · #35d8a9 · #111217</span>
      </figcaption>
    </figure>
  </div>
  <footer>
    <strong>AI-generated with Google Gemini, directed and selected by Rambabu.</strong><br>
    Created 2026-11-10. Not hand-drawn. Visible Gemini sparkle removed by inpainting;
    Google's invisible SynthID watermark remains in the image.
  </footer>
</body>
</html>
